<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Ouroboros console</title>
    <script>
      // Resolve the theme before first paint so the page never flashes.
      (function () {
        var mode = "system";
        try {
          mode = localStorage.getItem("ouroboros.theme") || "system";
        } catch (e) {}
        var dark =
          mode === "dark" ||
          (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-Ctj07cXz.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-DyXmpytq.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
