# Which docs describe which source files.
#
# When a pull request changes a file matched by an entry's `sources`, the
# advisory `doc-impact (advisory)` job lists each of that entry's `docs` the
# pull request did not also change, so a reviewer can check whether the prose
# still holds. It never blocks a merge. Tracking issue: Q00/ouroboros#2921 (D9).
#
# Schema: a list of entries, each with
#   sources: [glob, ...]   repository-relative; `*` and `?` stay inside one path
#                          segment, `**` spans any number of segments
#   docs:    [path, ...]   repository-relative files, no globs
#   note:    string        optional; what to look at in those docs
#
# Check it locally:
#   uv run python3 scripts/check-doc-impact.py --validate
#   uv run python3 scripts/check-doc-impact.py --base origin/main
#
# This is the single source for the "Doc Mapping" sections of CONTRIBUTING.md.
# Keep the groups below in the order of those sections.

