name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  claude-sdk:
    name: Test Claude SDK (MCP 1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install isolated Claude SDK profile
        run: uv sync --python 3.12 --dev --extra claude-sdk

      - name: Verify SDK and MCP 1 contract
        run: |
          uv run --python 3.12 --no-sync python - <<'PY'
          from importlib.metadata import version

          import claude_agent_sdk
          import mcp

          assert claude_agent_sdk is not None
          assert mcp is not None
          assert version("claude-agent-sdk") == "0.2.144"
          assert version("anthropic") == "1.0.0"
          assert version("mcp").split(".", maxsplit=1)[0] == "1"
          PY
          uv pip check

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # PRs gate on the 3.12 floor only; pushes to main/develop run the full
        # matrix (3.14 also exercises the litellm-free dependency profile), so
        # version-specific regressions are caught at merge time, before release.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.12", "3.13", "3.14"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.python-version }}" == "3.14" ]]; then
            echo "Installing dependency groups: dev + mcp-test"
            uv sync --python "${{ matrix.python-version }}" --dev --group mcp-test
          else
            echo "Installing dependency groups: dev + mcp-test + litellm-test"
            uv sync --python "${{ matrix.python-version }}" --dev --group mcp-test --group litellm-test
          fi

      - name: Check dependency consistency
        run: |
          uv run --python "${{ matrix.python-version }}" --no-sync python --version
          uv run --python "${{ matrix.python-version }}" --no-sync python - <<'PY'
          import importlib.util

          print("litellm installed:", importlib.util.find_spec("litellm") is not None)
          assert importlib.util.find_spec("mcp") is not None, "MCP test profile is missing"
          PY
          uv pip check

      - name: Run pytest
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          # One coverage run is sufficient; instrumenting every Python version
          # triples CPU cost and makes real-time tests contend for no added signal.
          COV_ARGS=""
          if [[ "${{ github.event_name }}" != "pull_request" && "${{ matrix.python-version }}" == "3.12" ]]; then
            COV_ARGS="--cov=src/ouroboros --cov-report=xml"
          fi
          uv run --python "${{ matrix.python-version }}" --no-sync pytest tests/ -n 4 --dist worksteal --durations=25 -m "not performance" $COV_ARGS -q

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1


  runtime-sandbox-windows:
    # The execution sandbox's Windows backend (an AppContainer) runs only on
    # Windows. Its tests fail, rather than skip, on this runner when the
    # backend is unavailable, so a green run means the confinement was tested.
    name: Runtime sandbox (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --python 3.12 --dev

      - name: Run native Windows plugin hook tests
        run: uv run --python 3.12 --no-sync pytest tests/unit/scripts/test_windows_plugin_hooks.py -n 0 -q

      - name: Run the runtime sandbox tests
        env:
          PYTHONFAULTHANDLER: "1"
        # Serial: the timeout tests measure wall-clock time, and one test
        # removes the persistent read grants it made.
        run: uv run --python 3.12 --no-sync pytest tests/unit/runtime/test_exec_sandbox.py tests/unit/runtime/test_exec_sandbox_windows.py -n 0 -rs --durations=15 -q

      - name: Run targeted Windows detached worker regressions
        id: detached-worker-tests
        shell: pwsh
        env:
          HOME: ${{ runner.temp }}/ooo-detached-worker/home
          USERPROFILE: ${{ runner.temp }}/ooo-detached-worker/home
          APPDATA: ${{ runner.temp }}/ooo-detached-worker/home/AppData/Roaming
          LOCALAPPDATA: ${{ runner.temp }}/ooo-detached-worker/home/AppData/Local
          TEMP: ${{ runner.temp }}/ooo-detached-worker/tmp
          TMP: ${{ runner.temp }}/ooo-detached-worker/tmp
          OOO_WORKER_EVIDENCE: ${{ runner.temp }}/ooo-detached-worker
          OUROBOROS_DASHBOARD: "0"
          OUROBOROS_TELEMETRY: "0"
          PYTHONFAULTHANDLER: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          foreach ($directory in @($env:HOME, $env:APPDATA, $env:LOCALAPPDATA, $env:TEMP)) {
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
          }
          # Install the MCP profile only after the existing Windows checks.
          uv sync --frozen --python 3.12 --dev --group mcp-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --python 3.12 --no-sync python -c "import sys; assert sys.platform == 'win32'; assert sys.prefix != sys.base_prefix, 'Windows venv required for redirector regression tests'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A targeted subset: helper safety, launch options, lifecycle and windows.
          $selectedTests = @(
            'tests/integration/mcp/test_detached_probe_process.py',
            'tests/unit/mcp/test_detached_jobs.py',
            'tests/integration/mcp/test_detached_job_worker.py::test_detached_job_survives_accepting_process_exit',
            'tests/integration/mcp/test_detached_job_worker.py::test_external_controller_cancels_detached_owner',
            'tests/integration/mcp/test_detached_job_worker.py::test_nested_handoff_gets_independent_durable_owner',
            'tests/integration/mcp/test_detached_worker_window.py'
          )
          $testTemp = Join-Path $env:OOO_WORKER_EVIDENCE 'pytest'
          $junit = Join-Path $env:OOO_WORKER_EVIDENCE 'results.xml'
          uv run --python 3.12 --no-sync pytest @selectedTests -n 0 -rs --durations=15 -q --basetemp $testTemp --junitxml $junit
          exit $LASTEXITCODE

      - name: Report detached worker verification scope
        if: always()
        shell: python
        env:
          OOO_WORKER_EVIDENCE: ${{ runner.temp }}/ooo-detached-worker
          OOO_WORKER_TEST_OUTCOME: ${{ steps.detached-worker-tests.outcome }}
        run: |
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          evidence = Path(os.environ["OOO_WORKER_EVIDENCE"])
          report = evidence / "results.xml"
          lines = ["### Windows detached worker targeted regressions", "",
                   "This subset does not cover the entire worker test module.", "",
                   f"Test step outcome: {os.environ['OOO_WORKER_TEST_OUTCOME']}", ""]
          invalid = False
          if not report.exists():
              lines.append("NOT VERIFIED: no JUnit report was produced.")
              invalid = True
          else:
              cases = list(ET.parse(report).iter("testcase"))
              failed = sum(case.find("failure") is not None or case.find("error") is not None for case in cases)
              skipped = sum(case.find("skipped") is not None for case in cases)
              passed = len(cases) - failed - skipped
              lines += [f"Observed: {passed} passed, {failed} failed/error, {skipped} skipped.", "",
                        "| Observation | Result | Detail |", "|---|---|---|"]
              invalid = not cases or passed == 0 or failed > 0
              checks = (
                  ("Console association", "test_venv_worker_completes_without_allocating_a_console_window"),
                  ("Visible window", "test_venv_worker_completes_without_a_visible_console_window"),
              )
              for label, name in checks:
                  matches = [case for case in cases if case.get("name") == name]
                  status, detail = "NOT VERIFIED", "Expected test result is missing or ambiguous."
                  if len(matches) != 1:
                      invalid = True
                  else:
                      case = matches[0]
                      skip = case.find("skipped")
                      if case.find("failure") is not None or case.find("error") is not None:
                          status, detail = "FAIL", "See JUnit and process observation artifacts."
                      elif skip is not None:
                          status = "UNSUPPORTED / NOT VERIFIED"
                          detail = skip.get("message") or skip.text or "Observation unavailable."
                          print(f"::warning::{label}: {status}: {detail}")
                      else:
                          status, detail = "PASS", "Legacy positive control and candidate assertions passed."
                  detail = " ".join(detail.split()).replace("|", "\\|")
                  lines.append(f"| {label} | {status} | {detail} |")
          text = "\n".join(lines) + "\n"
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / "summary.md").write_text(text, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(text)
          print(text)
          if invalid:
              raise SystemExit(1)

      - name: Upload detached worker regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-detached-worker-evidence
          path: |
            ${{ runner.temp }}/ooo-detached-worker/results.xml
            ${{ runner.temp }}/ooo-detached-worker/summary.md
            ${{ runner.temp }}/ooo-detached-worker/pytest/**/console.json
            ${{ runner.temp }}/ooo-detached-worker/pytest/**/visible-windows.json
          if-no-files-found: warn
          retention-days: 7

  performance-budget:
    name: Performance budget (advisory)
    if: github.event_name == 'push'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --python 3.12 --dev --group mcp-test --group litellm-test

      - name: Run isolated performance budgets
        run: uv run --python 3.12 --no-sync pytest tests/ -m performance -n 0 --durations=10 -q

  coverage:
    name: Upload coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-3.12
          path: coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coverage/coverage-3.12/coverage.xml
          use_oidc: true
          # This job now runs only on push (PRs skip coverage entirely), making
          # it the sole coverage-publication path. A silent upload failure here
          # would mean coverage stops updating with no signal, so surface it.
          fail_ci_if_error: true
          flags: unittests
          name: codecov
