name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv sync --dev
          uv pip check

      - name: Validate release metadata
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          if [[ "$VERSION" == *.dev* ]]; then
            echo "Development versions cannot be published from release tags: $VERSION" >&2
            exit 1
          fi
          python scripts/sync-plugin-version.py --require-canonical --version "$VERSION"

      - name: Build package
        run: |
          uv build

      - name: Check package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          uv publish --dry-run dist/*
          VERSION="${REF_NAME#v}"
          PACKAGE_VERSION="$(python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_files = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata_files) != 1:
                  raise SystemExit(f"expected exactly one METADATA file, found {len(metadata_files)}")
              metadata = archive.read(metadata_files[0]).decode("utf-8")
          versions = [line.removeprefix("Version: ") for line in metadata.splitlines() if line.startswith("Version: ")]
          if len(versions) != 1:
              raise SystemExit(f"expected exactly one package version, found {len(versions)}")
          print(versions[0])
          PY
          )"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "Package version $PACKAGE_VERSION does not match release tag $VERSION" >&2
            exit 1
          fi

      - name: Detect pre-release
        id: prerelease
        # Pass the ref name via env, not direct ${{ }} interpolation into the
        # shell: env values are provided as data, so a crafted tag name can't be
        # parsed as shell (GitHub Actions script-injection hardening, CWE-94).
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" =~ (a|alpha|b|beta|rc|dev) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: dist/*
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tui:
    name: Build TUI (${{ matrix.target }})
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --manifest-path crates/ouroboros-tui/Cargo.toml --release --target ${{ matrix.target }}

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: |
          cp crates/ouroboros-tui/target/${{ matrix.target }}/release/ouroboros-tui ouroboros-tui-${{ matrix.target }}

      - name: Re-sign binary (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - ouroboros-tui-${{ matrix.target }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: |
          cp crates/ouroboros-tui/target/${{ matrix.target }}/release/ouroboros-tui.exe ouroboros-tui-${{ matrix.target }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ouroboros-tui-${{ matrix.target }}
          path: ouroboros-tui-${{ matrix.target }}*

  attach-tui-binaries:
    name: Attach TUI Binaries to Release
    runs-on: ubuntu-latest
    needs: [release, build-tui]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ouroboros-tui-*
          merge-multiple: true

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: ouroboros-tui-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv sync --dev
          uv pip check

      - name: Build package
        run: |
          uv build

      - name: Validate built package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          PACKAGE_VERSION="$(python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_files = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata_files) != 1:
                  raise SystemExit(f"expected exactly one METADATA file, found {len(metadata_files)}")
              metadata = archive.read(metadata_files[0]).decode("utf-8")
          versions = [line.removeprefix("Version: ") for line in metadata.splitlines() if line.startswith("Version: ")]
          if len(versions) != 1:
              raise SystemExit(f"expected exactly one package version, found {len(versions)}")
          print(versions[0])
          PY
          )"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "Package version $PACKAGE_VERSION does not match release tag $VERSION" >&2
            exit 1
          fi

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv publish --check-url https://pypi.org/simple/ dist/*

  homebrew:
    name: Bump Homebrew Formula
    runs-on: macos-latest
    needs: publish
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Resolve release channel
        id: gate
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          # The tap tracks stable only; `v*.*.*` also matches a 0.52.0b1 tag.
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "$VERSION is a pre-release; leaving the formula on the last stable"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require tap credentials
        if: steps.gate.outputs.stable == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          # Fail closed: a silently skipped bump is how the formula drifted 17
          # releases behind before this job existed.
          if [ -z "$DEPLOY_KEY" ]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY is not set; cannot push to Q00/homebrew-tap" >&2
            exit 1
          fi

      - name: Bump formula
        if: steps.gate.outputs.stable == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          brew tap Q00/tap
          echo "TAP_DIR=$(brew --repository Q00/tap)" >> "$GITHUB_ENV"
          ./scripts/bump-homebrew-formula.sh "$VERSION" Q00/tap/ouroboros-ai

      # Verify before publishing: a formula that cannot build is worse than one
      # that is a release behind, and the tap has no CI of its own.
      - name: Verify formula
        if: steps.gate.outputs.stable == 'true'
        run: |
          brew audit --online Q00/tap/ouroboros-ai
          brew install --build-from-source Q00/tap/ouroboros-ai
          brew test Q00/tap/ouroboros-ai

      - name: Push formula
        if: steps.gate.outputs.stable == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if git -C "$TAP_DIR" diff --quiet; then
            echo "formula already at $VERSION"
            exit 0
          fi

          # A deploy key, not a PAT: write access is scoped to this one
          # repository and carries no account identity or expiry to renew.
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git -C "$TAP_DIR" config user.name "github-actions[bot]"
          git -C "$TAP_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TAP_DIR" remote set-url origin git@github.com:Q00/homebrew-tap.git
          git -C "$TAP_DIR" add Formula/ouroboros-ai.rb
          git -C "$TAP_DIR" commit -m "ouroboros-ai $VERSION"
          git -C "$TAP_DIR" push origin HEAD:main
